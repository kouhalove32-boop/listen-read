name: Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest
      - name: Validate problems.json
        run: python tools/check_problems.py
      - name: JS tests (src/parser.js)
        run: node --test tests/*.test.mjs
      - name: Python tests (tools/textproc.py, parity with JS)
        run: python -m pytest -q tests
